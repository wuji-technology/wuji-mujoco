[workspace]
name = "wuji-mujoco"
version = "0.1.0"
description = "MuJoCo simulation demo for the Wuji Hand."
license = "Apache-2.0"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"

[pypi-dependencies]
mujoco = "==3.11.0"
numpy = ">=1.24.0"

[tasks]
sim = "python run_sim.py"
